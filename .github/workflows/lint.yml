name: Lint skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/lint-skills.py
